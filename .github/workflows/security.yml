name: Security

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: auto

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Die Bibliotheken unter CMS/assets/ sind Kopien ohne Lockfile; Trivy erkennt sie nur über die
      # Spiegel-Manifeste in .github/deps/ (composer.lock, package-lock.json). Der Abgleich Manifest ↔ Bundle
      # läuft in TESTS/security/dependencies.php.
      - name: Trivy – gebündelte Bibliotheken (blockierend ab HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .github/deps
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # Mittlere/niedrige Funde nur berichten, damit sie im Log sichtbar sind, ohne den Lauf zu brechen.
      - name: Trivy – gebündelte Bibliotheken (Bericht MEDIUM/LOW)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .github/deps
          scanners: vuln
          severity: LOW,MEDIUM
          exit-code: '0'
          format: table

      # Unverändert nur berichtend: Secret-Scan und übrige Lockfiles im gesamten Repository.
      - name: Trivy – Repository (Bericht)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table

  syntax-check:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: PHP Lint
        # Release-Prüfung 4.1.0 (PR #4): Compile-Deprecations und Warnings aus eigenem Code lassen den Lint scheitern
        # (php -l allein meldet nur Syntaxfehler); aus gebündelten Bibliotheken (vendor/, assets/) nur als Warnung.
        run: |
          set -o pipefail
          if [[ "${{ matrix.php-version }}" == "8.4" ]]; then
            find CMS -type f -name "*.php" ! -name "bootstrap85.php" -print0
          else
            find CMS -type f -name "*.php" -print0
          fi | \
          xargs -0 -n1 php -d error_reporting=-1 -d display_errors=1 -l > lint.log 2>&1 || { cat lint.log; exit 1; }
          grep -E "(Deprecated|Warning):" lint.log | grep -E "/CMS/(vendor|assets)/" | sed 's/^/::warning::/' || true
          if grep -E "(Deprecated|Warning):" lint.log | grep -vE "/CMS/(vendor|assets)/"; then
            echo "::error::PHP ${{ matrix.php-version }}: Deprecation/Warning im eigenen Code (siehe oben)"
            exit 1
          fi
          echo "$(grep -c 'No syntax errors' lint.log) Dateien ohne Syntaxfehler"

      - name: Test-Suiten (statisch, ohne Datenbank)
        run: php TESTS/run-all.php
