name: Security

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      matrix:
        language:
          - php

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: php

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: returntocorp/semgrep-action@v1
        with:
          config: auto

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Trivy File Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table

  secret-scan:
    name: GitLeaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2

  syntax-check:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: PHP Lint
        run: |
          if [[ "${{ matrix.php-version }}" == "8.4" ]]; then
            find CMS -type f -name "*.php" ! -name "bootstrap85.php" -print0
          else
            find CMS -type f -name "*.php" -print0
          fi | \
          xargs -0 -n1 php -l
